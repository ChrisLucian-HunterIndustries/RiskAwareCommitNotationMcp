[project]
name = "risk-aware-commit-notation-mcp"
version = "0.1.0"
description = "MCP server for committing to a Git repository using Arlo's Risk-Aware Commit Notation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
risk-aware-commit-notation-mcp = "racn_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racn_mcp"]
