name: Format

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run format
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ". a Auto-format code"
