[tools]
python = "3.14"
uv = "latest"

[tasks.build_and_test]
description = "Install dependencies and run the test suite"
run = [
    "uv sync",
    "uv run pytest",
]

[tasks.run]
description = "Run the MCP server on stdio"
run = "uv run risk-aware-commit-notation-mcp"

[tasks.format]
description = "Format all code"
run = [
    "uv sync",
    "uv run ruff format .",
]

[tasks.docs]
description = "Regenerate Markdown snippets embedded in docs (e.g. README.md)"
run = [
    "dotnet tool restore",
    "dotnet mdsnippets",
]
